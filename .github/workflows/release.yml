name: Release

# Publishes the downloadable APKs. Push a tag such as `v2.0.0`, or run the workflow
# manually and type the tag, and the per-ABI APKs are attached to a GitHub Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    env:
      # Exposed as a job-level variable so the signing step can be skipped when the
      # repository has no key configured, instead of failing the whole release.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      # With the four repository secrets set the APKs are signed with the project's own
      # key; without them the workflow still publishes unsigned-release APKs.
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/manfaz.jks"
          {
            echo "manfaz.storeFile=$RUNNER_TEMP/manfaz.jks"
            echo "manfaz.storePassword=$KEYSTORE_PASSWORD"
            echo "manfaz.keyAlias=$KEY_ALIAS"
            echo "manfaz.keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Assemble release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            base="$(basename "$apk" .apk)"
            abi="$(echo "$base" | sed -E 's/^app-//; s/-release(-unsigned)?$//')"
            cp "$apk" "dist/manfaz-${RELEASE_TAG}-${abi}.apk"
          done
          ls -l dist
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Manfaz VPN ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
