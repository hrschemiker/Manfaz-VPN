name: Release

# Publishes the downloadable APKs. Push a tag such as `v2.0.0`, or run the workflow
# manually and type the tag, and the per-ABI APKs are attached to a GitHub Release.
#
# Signing: set the four repository secrets below and the APKs are signed with the
# project's own key, exactly like a local `assembleRelease`. Without them the workflow
# still publishes, but the APKs are unsigned — Android will refuse to install those, so
# the release is marked as a pre-release and says so.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    env:
      # Exposed as a job-level variable so the signing step can be skipped when the
      # repository has no key configured, instead of failing the whole release.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper's executable bit is preserved in git, but a fresh clone on a
      # different filesystem can still land without it.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/manfaz.jks"
          {
            echo "manfaz.storeFile=$RUNNER_TEMP/manfaz.jks"
            echo "manfaz.storePassword=$KEYSTORE_PASSWORD"
            echo "manfaz.keyAlias=$KEY_ALIAS"
            echo "manfaz.keyPassword=$KEY_PASSWORD"
          } >> local.properties

      - name: Assemble release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          signed=true
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            base="$(basename "$apk" .apk)"
            case "$base" in *-unsigned) signed=false ;; esac
            abi="$(echo "$base" | sed -E 's/^app-//; s/-release(-unsigned)?$//')"
            suffix=""
            [ "$signed" = true ] || suffix="-unsigned"
            cp "$apk" "dist/manfaz-${RELEASE_TAG}-${abi}${suffix}.apk"
          done
          ls -l dist
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Write the installation notice
        run: |
          if [ "${{ steps.collect.outputs.signed }}" = "true" ]; then
            cat > NOTES.md <<'EOF'
          Most modern Android phones use **arm64-v8a**. Use **armeabi-v7a** only for older
          32-bit devices. `SHA256SUMS.txt` lists the checksum of every file.
          EOF
          else
            cat > NOTES.md <<'EOF'
          > **These APKs are unsigned and Android will refuse to install them.**
          >
          > No signing key is configured for this repository, so the build could not sign
          > them. To publish installable APKs, add the app's keystore as the repository
          > secrets `KEYSTORE_BASE64` (the `.jks` file, base64-encoded), `KEYSTORE_PASSWORD`,
          > `KEY_ALIAS` and `KEY_PASSWORD`, then re-run the **Release** workflow for this tag.
          > Using the project's existing key also keeps updates installable over an existing
          > installation.

          Most modern Android phones use **arm64-v8a**. Use **armeabi-v7a** only for older
          32-bit devices. `SHA256SUMS.txt` lists the checksum of every file.
          EOF
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Manfaz VPN ${{ env.RELEASE_TAG }}
          body_path: NOTES.md
          append_body: true
          generate_release_notes: true
          # An unsigned build is not something anyone can install, so it must not sit at
          # the top of the releases page as if it were the current download.
          prerelease: ${{ steps.collect.outputs.signed != 'true' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
