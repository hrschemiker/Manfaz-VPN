name: Release

# Publishes the downloadable APKs. Push a tag such as `v2.0.0`, or run the workflow
# manually and type the tag, and the per-ABI APKs are attached to a GitHub Release.
#
# Signing: set KEYSTORE_BASE64 and KEYSTORE_PASSWORD as repository secrets and the APKs
# are signed with the project's key. The alias is fixed below because it is not a secret
# on its own — the keystore file is. Without the secrets the workflow still publishes, but
# the APKs are unsigned, Android refuses to install those, so the release is marked as a
# pre-release and says why.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (for example v2.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish APKs
    runs-on: ubuntu-latest
    env:
      # Exposed as a job-level variable so the signing step can be skipped when the
      # repository has no key configured, instead of failing the whole release.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      # Not a secret: it only names an entry inside the (secret) keystore file.
      KEY_ALIAS: manfaz
    steps:
      # No explicit ref: the workflow builds whatever it was started on. A tag push
      # builds that tag; a manual run builds the branch you picked and creates the tag
      # from it, so a release does not require the tag to exist beforehand.
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The wrapper's executable bit is preserved in git, but a fresh clone on a
      # different filesystem can still land without it.
      - name: Make the Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon testReleaseUnitTest

      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/manfaz.p12"
          {
            echo "manfaz.storeFile=$RUNNER_TEMP/manfaz.p12"
            echo "manfaz.storePassword=$KEYSTORE_PASSWORD"
            echo "manfaz.keyAlias=$KEY_ALIAS"
            echo "manfaz.keyPassword=$KEYSTORE_PASSWORD"
          } >> local.properties

      - name: Assemble release APKs
        run: ./gradlew --no-daemon assembleRelease

      - name: Collect APKs
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          signed=true
          for apk in app/build/outputs/apk/release/*.apk; do
            [ -e "$apk" ] || continue
            base="$(basename "$apk" .apk)"
            case "$base" in *-unsigned) signed=false ;; esac
            abi="$(echo "$base" | sed -E 's/^app-//; s/-release(-unsigned)?$//')"
            suffix=""
            [ "$signed" = true ] || suffix="-unsigned"
            cp "$apk" "dist/manfaz-${RELEASE_TAG}-${abi}${suffix}.apk"
          done
          ls -l dist
          (cd dist && sha256sum ./*.apk > SHA256SUMS.txt)
          echo "signed=$signed" >> "$GITHUB_OUTPUT"

      - name: Write the installation notice
        run: |
          if [ "${{ steps.collect.outputs.signed }}" = "true" ]; then
            cat > NOTES.md <<'EOF'
          > **Coming from 1.9.0 or earlier?** Uninstall the old app first, then install this
          > one. The signing key changed in 2.0.0, and Android will not install a differently
          > signed build over an existing one. Back up your servers from
          > **Settings -> Secure backup** before uninstalling.

          Most modern Android phones use **arm64-v8a**. Use **armeabi-v7a** only for older
          32-bit devices. `SHA256SUMS.txt` lists the checksum of every file.
          EOF
          else
            cat > NOTES.md <<'EOF'
          > **These APKs are unsigned and Android will refuse to install them.**
          >
          > No signing key is configured for this repository, so the build could not sign
          > them. Add the `KEYSTORE_BASE64` and `KEYSTORE_PASSWORD` repository secrets, then
          > re-run the **Release** workflow for this tag.

          Most modern Android phones use **arm64-v8a**. Use **armeabi-v7a** only for older
          32-bit devices. `SHA256SUMS.txt` lists the checksum of every file.
          EOF
          fi

      # Re-running a tag would otherwise leave the previous run's files sitting next to
      # the new ones — including unsigned APKs from a run made before the key existed.
      - name: Remove assets from an earlier run of this tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r asset; do
              [ -n "$asset" ] || continue
              echo "deleting stale asset: $asset"
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            done
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Manfaz VPN ${{ env.RELEASE_TAG }}
          body_path: NOTES.md
          append_body: true
          generate_release_notes: true
          # An unsigned build is not something anyone can install, so it must not sit at
          # the top of the releases page as if it were the current download.
          prerelease: ${{ steps.collect.outputs.signed != 'true' }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
